name: diag-llm

# 一次性诊断矩阵：对智谱编程套餐的候选端点/协议/模型组合各发 1 次最小请求，
# 打印状态码与响应体，一次运行定位「哪个端点 + 哪个协议 + 哪个模型名」可用。
# 同时保留对 vars.LLM_BASE_URL 当前配置的探测（协议按 URL 自适应，与 src/llm.mjs 一致）。
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: LLM probe matrix
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          node --input-type=module -e '
          const key = process.env.LLM_API_KEY;
          const model = process.env.LLM_MODEL || "glm-5.3";
          const anthropicHeaders = {
            "Authorization": "Bearer " + key, "x-api-key": key,
            "anthropic-version": "2023-06-01", "Content-Type": "application/json",
          };
          const openaiHeaders = { "Authorization": "Bearer " + key, "Content-Type": "application/json" };
          const anthropicBody = (m, c = "只回复两个字：正常") =>
            JSON.stringify({ model: m, max_tokens: 32, messages: [{ role: "user", content: c }] });
          const openaiBody = (m, c = "只回复两个字：正常") =>
            JSON.stringify({ model: m, max_tokens: 32, messages: [{ role: "user", content: c }] });

          // [标签, 方法, URL, headers, body]
          const targets = [
            ["A1 anthropic 模型清单", "GET", "https://open.bigmodel.cn/api/anthropic/v1/models", anthropicHeaders, null],
            ["A2 anthropic " + model, "POST", "https://open.bigmodel.cn/api/anthropic/v1/messages", anthropicHeaders, anthropicBody(model)],
            ["A3 anthropic " + model + " (beta 参数)", "POST", "https://open.bigmodel.cn/api/anthropic/v1/messages?beta=true", anthropicHeaders, anthropicBody(model)],
            ["A4 anthropic 仿 Claude Code UA", "POST", "https://open.bigmodel.cn/api/anthropic/v1/messages", { ...anthropicHeaders, "User-Agent": "claude-cli/2.0.0 (external, cli)", "x-app": "cli" }, anthropicBody(model)],
            ["B1 openai-coding " + model, "POST", "https://open.bigmodel.cn/api/coding/paas/v4/chat/completions", openaiHeaders, openaiBody(model)],
            ["B2 openai-coding glm-5.3-flash", "POST", "https://open.bigmodel.cn/api/coding/paas/v4/chat/completions", openaiHeaders, openaiBody("glm-5.3-flash")],
          ];
          if (process.env.LLM_BASE_URL) {
            const base = process.env.LLM_BASE_URL.replace(/\/+$/, "");
            const anthropic = /(^|\.)anthropic\.com|\/anthropic/.test(base);
            targets.push(["C1 当前配置 " + base + " (" + (anthropic ? "anthropic" : "openai") + ")", "POST",
              base + (anthropic ? "/v1/messages" : "/chat/completions"),
              anthropic ? anthropicHeaders : openaiHeaders,
              anthropic ? anthropicBody(model) : openaiBody(model)]);
          }

          for (const [tag, method, url, headers, body] of targets) {
            const shortUrl = url.replace(/^https:\/\/open\.bigmodel\.cn/, "");
            try {
              const res = await fetch(url, { method, headers, body, signal: AbortSignal.timeout(30000) });
              const t = await res.text();
              console.log("==", tag, "→", res.status, shortUrl);
              console.log("  ", t.slice(0, 400).replace(/\n/g, " "));
            } catch (e) {
              console.log("==", tag, "→ network error:", String(e).slice(0, 150), shortUrl);
            }
          }
          '
