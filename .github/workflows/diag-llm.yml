name: diag-llm

# 一次性诊断：对 LLM 端点发 1 次与主管线同构的请求（协议按 BASE_URL 自适应，
# 与 src/llm.mjs 的 isAnthropicBase 判定保持一致），打印状态码与响应体，
# 用于定位 429/404 的具体原因（限流/欠费/端点/模型名）。排查后可删除本文件。
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: One-shot LLM probe
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          node -e '
          const base = (process.env.LLM_BASE_URL || "https://api.deepseek.com").replace(/\/+$/, "");
          const model = process.env.LLM_MODEL || "deepseek-chat";
          const anthropic = /(^|\.)anthropic\.com|\/anthropic/.test(base);
          console.log("probe:", model, "@", base, "| protocol:", anthropic ? "anthropic" : "openai");
          fetch(base + (anthropic ? "/v1/messages" : "/chat/completions"), {
            method: "POST",
            headers: anthropic
              ? { "x-api-key": process.env.LLM_API_KEY, "Authorization": "Bearer " + process.env.LLM_API_KEY,
                  "anthropic-version": "2023-06-01", "Content-Type": "application/json" }
              : { Authorization: "Bearer " + process.env.LLM_API_KEY, "Content-Type": "application/json" },
            body: JSON.stringify(anthropic
              ? { model, max_tokens: 16, messages: [{ role: "user", content: "ping" }] }
              : { model, temperature: 0.2, max_tokens: 16,
                  messages: [{ role: "user", content: "ping" }],
                  response_format: { type: "json_object" } }),
            signal: AbortSignal.timeout(30000),
          })
          .then(async r => {
            const t = await r.text();
            console.log("HTTP", r.status);
            console.log(t.slice(0, 600));
            try {
              const j = JSON.parse(t);
              if (r.status === 200 && !j.content && !j.choices)
                console.log("=> 伪 200：响应体是错误包装（网关行为），多为模型名或端点不匹配，不算成功");
            } catch { /* 非 JSON 体 */ }
          })
          .catch(e => console.log("network error:", String(e).slice(0, 200)));
          '
