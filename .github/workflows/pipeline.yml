name: pipeline

on:
  schedule:
    - cron: "17 1 * * *" # 每日一次（UTC 01:17 = 北京 09:17，覆盖隔夜美股时段动态）
  workflow_dispatch: {}    # 手动触发（仓库 write 权限者；fork PR 拿不到 secrets）

permissions:
  contents: write # 提交 data/ 回仓库（GITHUB_TOKEN 的推送不会级联触发工作流）
  issues: write   # P0 告警开 Issue

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-24.04 # 固定版本，不让 latest 变移动靶（2026-10 起 latest 迁 Ubuntu 26）
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run pipeline
        env:
          # LLM_API_KEY 为加密 Secret（Settings → Secrets and variables → Actions 设置）；
          # LLM_BASE_URL / LLM_MODEL / LLM_PROTOCOL / MAX_LLM_ITEMS / LLM_MAX_CONTENT_CHARS
          # 为普通 Variables（非敏感，均可缺省：DeepSeek / 自动判协议 / 20 条 / 自动探测）
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_PROTOCOL: ${{ vars.LLM_PROTOCOL }}
          MAX_LLM_ITEMS: ${{ vars.MAX_LLM_ITEMS }}
          LLM_MAX_CONTENT_CHARS: ${{ vars.LLM_MAX_CONTENT_CHARS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node src/main.mjs

      - name: Commit & push data
        run: |
          git config user.name "pipeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: cycle $(date -u +%F_%H:%M)"
          # 本地 feeds 推送可能落在 checkout 与 push 之间——裸推被拒不重试会丢整轮产出
          # （seen 未落远端，下轮重复消费）。rebase 必然干净：data 产物与 feeds 路径不相交。
          if ! git push; then
            echo "push 被拒（远端有新提交），rebase 后重试一次"
            git pull --rebase origin main
            git push
          fi
